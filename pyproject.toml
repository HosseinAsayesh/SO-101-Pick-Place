[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101"
version = "0.1.0"
description = "Vision-based pick-and-place with a simulated SO-101 arm (MuJoCo)"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2", "numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
